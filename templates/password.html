{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block body %}
<h1>Change password</h1>
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Current password <input type="password" name="old" autocomplete="current-password" required></label>
  <label>New password, at least 8 characters <input type="password" name="new" autocomplete="new-password" required minlength="8"></label>
  <label>Repeat new password <input type="password" name="again" autocomplete="new-password" required minlength="8"></label>
  <button class="primary">Save password</button>
</form>
{% endblock %}
